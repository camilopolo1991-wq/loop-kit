onboarding:
  seen:
    profile_build_offered: true
    tool_progress_prompt: true
    busy_input_prompt: true
voice:
  gpt_live:
    voice: marin
fallback_providers: []
moa:
  presets:
    default:
      reference_models:
        - provider: nous
          model: nous/welcome
          enabled: true
        - provider: openrouter
          model: deepseek/deepseek-v4-pro
          enabled: true
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
    - provider: nous
      model: nous/welcome
      enabled: true
    - provider: openrouter
      model: deepseek/deepseek-v4-pro
      enabled: true
  aggregator:
    provider: openrouter
    model: anthropic/claude-opus-4.8
  degraded_reference_policy: loud
